name: Windows build and real GUI render
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a public GitHub Release after the build passes'
        type: boolean
        default: false
  push:
    branches: [feature/v1.3.6-retention]
permissions:
  contents: read
jobs:
  verify-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - name: Preserve all 50 Shorts regressions and test optional Longform
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath unit-tests-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build EXE, run real GUI renders and relocate
        run: python tools/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: GeoRush-v1.3.6-Windows-EXE
          path: |
            dist/GeoRush-v1.3.6-Windows-EXE.zip
            dist/GeoRush-v1.3.6-Windows-EXE.zip.sha256
            dist/WINDOWS_BUILD_REPORT.json
            dist/GeoRush-v1.3.6-*.mp4
            dist/GeoRush-v1.3.6-*.jpg
            dist/GeoRush-v1.3.6-*-metadata.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation
          path: |
            unit-tests-windows.log
            build_validation
            build/GeoRushGenerator/warn-GeoRushGenerator.txt
  publish:
    # Public releases only on an explicit manual run with publish checked; pushes build artifacts only.
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: verify-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GeoRush-v1.3.6-Windows-EXE
          path: release
      - name: Publish tested EXE download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cat > notes.md <<'NOTES'
          Windows x64 executable distribution. Python and FFmpeg are bundled.
          Small polish release: the window title shows the real version and the stale install note is gone; the Longform description, tags and pinned comment now vary per video (intro, rules wording, call-to-action, subscribe line; the chapters with real timestamps and the hashtags stay in the single copyable description). Shorts, question timing, flags, duplicate prevention, SQLite and exact-three-file outputs are unchanged from v1.3.4.
          Extract the whole ZIP and run START_HERE.cmd or GeoRushGenerator.exe.
          Automated checks: all existing regressions plus recent-Shorts tests. Actual frozen EXE GUI-button renders for Shorts and 20/40-question Longform, full video/audio decode and Korean-path relocation. See WINDOWS_BUILD_REPORT.json.
          Limits: hosted Windows runner; manual visual/audio review and real OneDrive cloud sync remain to be checked on the user PC.
          NOTES
          gh release create v1.3.6-windows release/* --target "$SOURCE_SHA" --title "GeoRush v1.3.6 — retention" --notes-file notes.md
