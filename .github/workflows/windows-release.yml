name: Windows build and real GUI render
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Preserve all regression tests
        run: python -m unittest discover -s tests -v
      - name: Build Python-free EXE folder
        run: python tools/build_windows.py
      - name: Run frozen EXE GUI button to actual MP4
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'GeoRush-check.json'
          $output = Join-Path $env:RUNNER_TEMP 'OneDrive 테스트\바탕 화면\GeoRush_Output'
          $env:GEORUSH_FFMPEG = ''
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $exe = Join-Path $PWD 'dist\GeoRushGenerator\GeoRushGenerator.exe'
          $p = Start-Process -FilePath $exe -ArgumentList @('--distribution-check', "`"$report`"", '--output', "`"$output`"") -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw 'EXE timeout' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'EXE failed before report' }
          $r = Get-Content $report -Raw -Encoding utf8 | ConvertFrom-Json
          if ($r.status -ne 'PASS' -or -not $r.frozen) { throw (Get-Content $report -Raw) }
          Copy-Item $report dist\GeoRushGenerator\WINDOWS_VALIDATION.json
      - name: Zip only after EXE integration passes
        shell: pwsh
        run: Compress-Archive -Path dist\GeoRushGenerator -DestinationPath dist\GeoRush-v1.0-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GeoRush-v1.0-Windows-x64
          path: dist/GeoRush-v1.0-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation
          path: |
            ${{ runner.temp }}/GeoRush-check.json
            ${{ runner.temp }}/OneDrive 테스트/바탕 화면/GeoRush_Output
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GeoRush-v1.0-Windows-x64
          path: release
      - name: Publish tested download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip --title "GeoRush Windows $GITHUB_REF_NAME" --notes "Python-free Windows distribution. See included WINDOWS_VALIDATION.json for the executed frozen GUI-to-MP4 check and its limits."
