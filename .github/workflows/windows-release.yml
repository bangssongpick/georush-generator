name: Windows build and real GUI render
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - name: Preserve all 50 Shorts regressions and test optional Longform
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath unit-tests-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build EXE, run real GUI renders and relocate
        run: python tools/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: GeoRush-v1.3-Windows-EXE
          path: |
            dist/GeoRush-v1.3-Windows-EXE.zip
            dist/GeoRush-v1.3-Windows-EXE.zip.sha256
            dist/WINDOWS_BUILD_REPORT.json
            dist/GeoRush-v1.3-*.mp4
            dist/GeoRush-v1.3-*.jpg
            dist/GeoRush-v1.3-*-metadata.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation
          path: |
            unit-tests-windows.log
            build_validation
            build/GeoRushGenerator/warn-GeoRushGenerator.txt
  publish:
    needs: verify-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GeoRush-v1.3-Windows-EXE
          path: release
      - name: Publish tested EXE download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cat > notes.md <<'NOTES'
          Windows x64 executable distribution. Python and FFmpeg are bundled.
          Extract the whole ZIP and run START_HERE.cmd or GeoRushGenerator.exe.
          Select Shorts (unchanged) or Longform (20/30/40 questions; default 40, 7m04s). Native 1920x1080 landscape, editorial Easy-to-Expert rounds.
          Output: exactly three MP4/TXT/JPG files per video. Shorts names remain unchanged; Longform uses longform.mp4, longform_metadata.txt and longform_thumbnail.jpg. Internal history/diagnostics are preserved.
          Automated checks: all 50 Shorts regressions plus Longform tests. Actual frozen EXE GUI-button renders for Shorts and 20/40-question Longform. Full video/audio decode, every flag/answer layout, chapters, metadata, SQLite preservation, exact three output files and Korean-path relocation. See attached actual Windows samples and build report.
          Limits: hosted Windows runner; manual visual/audio review and real OneDrive cloud sync remain to be checked on the user PC.
          See WINDOWS_BUILD_REPORT.json for actual results and sizes.
          NOTES
          gh release create v1.3.0-windows release/* --target "$SOURCE_SHA" --title "GeoRush v1.3 — Shorts + Longform Windows EXE" --notes-file notes.md
