name: Windows build and real GUI render
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - name: Preserve 40 regressions plus presentation checks
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath unit-tests-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build EXE, run real GUI renders and relocate
        run: python tools/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: GeoRush-v1.2-Windows-EXE
          path: |
            dist/GeoRush-v1.2-Windows-EXE.zip
            dist/GeoRush-v1.2-Windows-EXE.zip.sha256
            dist/WINDOWS_BUILD_REPORT.json
            dist/GeoRush-v1.2-sample-*.mp4
            dist/GeoRush-v1.2-sample-*-frames.jpg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation
          path: |
            unit-tests-windows.log
            build_validation
            build/GeoRushGenerator/warn-GeoRushGenerator.txt
  publish:
    needs: verify-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GeoRush-v1.2-Windows-EXE
          path: release
      - name: Publish tested EXE download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cat > notes.md <<'NOTES'
          Windows x64 executable distribution. Python and FFmpeg are bundled.
          Extract the whole ZIP and run START_HERE.cmd or GeoRushGenerator.exe.
          Output: exactly shorts.mp4, shorts_metadata.txt and shorts_thumbnail.jpg per successful video. History and diagnostic data are internal.
          Automated checks: existing 40 regressions plus presentation tests, three improved videos with 13 exact frame inspections each, frozen GUI-button-to-MP4 rendering, full decode, audio, metadata, history, Korean paths and repeat after folder relocation.
          Limits: hosted Windows runner; manual visual/audio review and real OneDrive cloud sync remain to be checked on the user PC.
          See WINDOWS_BUILD_REPORT.json for actual results and sizes.
          NOTES
          gh release create v1.2.0-windows release/* --target "$SOURCE_SHA" --title "GeoRush v1.2 — Windows EXE" --notes-file notes.md
